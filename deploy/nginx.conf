# =====================================================================
# Nginx: recebe os acessos da internet (porta 80/443) e repassa para o Node (porta 3000).
# Copiar para: /etc/nginx/sites-available/formulario
# O formulário fica no subdomínio formulario.natandonato.io
# (a raiz natandonato.io é o portfólio, em outro arquivo do Nginx).
# O HTTPS (porta 443) é adicionado automaticamente pelo Certbot depois:
#   sudo certbot --nginx -d formulario.natandonato.io
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name formulario.natandonato.io;

    # Tamanho máximo do que o navegador pode enviar (o formulário é pequeno)
    client_max_body_size 64k;

    # Não mostra a versão do Nginx nas páginas de erro
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Repassa ao Node quem é o visitante e qual protocolo ele usou
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
